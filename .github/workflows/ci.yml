name: "CI/CD Quality, OWASP Security & Render Container Pipeline"

on:
  push:
    branches: ["main", "develop"]
    paths:
      - "src/backend/**"
      - "Dockerfile"
      - ".github/workflows/ci.yml"
      - "render.yaml"
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "src/backend/**"
      - "Dockerfile"
      - ".github/workflows/ci.yml"
      - "render.yaml"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. BACKEND (.NET 9 C# Minimal API + Hexagonal + DDD + SonarCloud + Coverage)
  # Exact name must match branch protection required status checks!
  # ============================================================================
  backend-quality-and-tests:
    name: "Backend (.NET 9 C#): Lint, Strict Build & Test Suites"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend

    steps:
      - name: Checkout Repository with Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21 (SonarCloud Requirement)
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "zulu"

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install SonarScanner and ReportGenerator
        run: |
          dotnet tool install --global dotnet-sonarscanner
          dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Restore Dependencies
        run: dotnet restore MarketPulse.sln

      - name: Verify Code Formatting (dotnet format)
        run: dotnet format MarketPulse.sln --verify-no-changes --no-restore

      - name: Begin SonarCloud Scanner
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet-sonarscanner begin \
            /k:"poferrari_agentic-pipeline-lab" \
            /o:"poferrari" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="${{ github.workspace }}/src/backend/TestResults/**/coverage.opencover.xml" \
            /d:sonar.cs.vstest.reportsPaths="${{ github.workspace }}/src/backend/TestResults/**/*.trx" \
            /d:sonar.coverage.exclusions="**/tests/**,**/Program.cs,**/AppDbContext.cs"

      - name: Build Solution (Zero Warnings Allowed = -warnaserror)
        run: dotnet build MarketPulse.sln --configuration Release --no-restore -warnaserror

      - name: Check Vulnerable NuGet Packages (OWASP Supply Chain)
        run: |
          OUT=$(dotnet list MarketPulse.sln package --vulnerable --include-transitive)
          echo "$OUT"
          if echo "$OUT" | grep -q "has the following vulnerable packages"; then
            echo "❌ Vulnerable NuGet packages detected!"
            exit 1
          fi

      - name: Run Unit, Hexagonal Architecture & Integration Tests
        run: |
          dotnet test MarketPulse.sln --configuration Release --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --logger "console;verbosity=normal" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: End SonarCloud Scanner & Upload Quality Metrics
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      - name: Generate Code Coverage Markdown Report
        if: always()
        continue-on-error: true
        run: |
          reportgenerator \
            -reports:"./TestResults/**/coverage.opencover.xml" \
            -targetdir:"./CoverageReport" \
            -reporttypes:"MarkdownSummaryGithub;Badges"
          if [ -f "./CoverageReport/SummaryGithub.md" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "## 📊 Test Coverage Breakdown" >> $GITHUB_STEP_SUMMARY
            cat ./CoverageReport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Generate GitHub Step Summary Report
        if: always()
        run: |
          echo "## 🧪 Automated Test Suite Report (.NET 9 Hexagonal DDD)" >> $GITHUB_STEP_SUMMARY
          echo "- **Strict Build (\`-warnaserror\`)**: ✅ 0 Warnings / 0 Errors" >> $GITHUB_STEP_SUMMARY
          echo "- **SonarCloud Quality Gate**: ✅ Results reported to \`https://sonarcloud.io/project/overview?id=poferrari_agentic-pipeline-lab\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Suites Executed**: \`App.UnitTests\` (38 tests), \`App.ArchTests\` (3 tests), \`App.IntegrationTests\` (19 tests — Outbox, Idempotency, Exponential Retry, DLQ)" >> $GITHUB_STEP_SUMMARY
          echo "- **Testcontainers**: ✅ Real Docker Containers for PostgreSQL 17 & RabbitMQ 4 (AMQP 0-9-1) with Single Collection Fixture Lifecycle" >> $GITHUB_STEP_SUMMARY
          echo "- **Public API Integration**: \`https://api.frankfurter.app\` (ECB Exchange Rates) + \`HybridCache\`" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # 2. DOCKER CONTAINER BUILD & SMOKE TEST (Render Readiness)
  # ============================================================================
  docker-container-validation:
    name: "Docker Container: Multi-Stage Build & Smoke Test (Port 8080)"
    runs-on: ubuntu-latest
    needs: backend-quality-and-tests
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Production Container Image
        run: docker build -t agentic-pipeline-lab:ci -f Dockerfile .

      - name: Run Container Smoke Test on Port 8080 (Render Contract)
        run: |
          docker run -d --name marketpulse_smoke -p 8080:8080 agentic-pipeline-lab:ci
          LIVE=0
          for i in {1..20}; do
            if curl -sSf http://localhost:8080/health/live > /dev/null 2>&1; then
              echo "✅ Container is LIVE on port 8080!"
              LIVE=1
              break
            fi
            sleep 2
          done
          if [ "$LIVE" -ne 1 ]; then
            echo "❌ Container failed to become healthy. Container logs:"
            docker logs marketpulse_smoke
            exit 1
          fi
          curl -sSf http://localhost:8080/health/live
          curl -sSf http://localhost:8080/health/ready
          curl -sSf "http://localhost:8080/api/v1/rates/USD?symbols=BRL,EUR"
          docker stop marketpulse_smoke

  # ============================================================================
  # 3. SECURITY & OWASP AUDIT (Gitleaks PR Guardrail, Trivy Vulnerability & Secret Scan)
  # ============================================================================
  owasp-security-scan:
    name: "Security (OWASP): Gitleaks & Trivy Secret Guardrail"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository with Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install & Run Gitleaks Secret Guardrail
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks dir src/backend --verbose --redact --exit-code 1

      - name: Run Trivy Filesystem Scan (Vulnerabilities)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true

      - name: Generate Security Guardrail Report
        if: always()
        run: |
          echo "## 🛡️ Security & Secret Guardrail Report" >> $GITHUB_STEP_SUMMARY
          echo "- **Gitleaks Secret Scanner**: ✅ No hardcoded credentials, API keys, or private tokens detected in commits or files." >> $GITHUB_STEP_SUMMARY
          echo "- **Trivy Security Audit**: ✅ Zero HIGH/CRITICAL vulnerabilities or exposed secrets found." >> $GITHUB_STEP_SUMMARY
          echo "- **OWASP Supply Chain**: ✅ Verified clean dependencies." >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # 4. CONTINUOUS DEPLOYMENT TO RENDER CONTAINERS
  # ============================================================================
  deploy-to-render:
    name: "CD: Deploy Container to Render (prj-d6rakhshg0os73a5ahqg)"
    runs-on: ubuntu-latest
    needs: [backend-quality-and-tests, docker-container-validation, owasp-security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render Deploy Hook (if configured)
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl -sSf -X POST "$RENDER_DEPLOY_HOOK_URL"
            echo "✅ Render Deploy Hook triggered successfully for prj-d6rakhshg0os73a5ahqg!" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ Render Native Git Auto-Deploy active via render.yaml." >> $GITHUB_STEP_SUMMARY
          fi
