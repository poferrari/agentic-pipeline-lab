name: "CI/CD Quality, OWASP Security & Render Container Pipeline"

on:
  push:
    branches: ["main", "develop"]
    paths:
      - "src/backend/**"
      - "Dockerfile"
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write
  checks: write
  deployments: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. BACKEND (.NET 9 C# Minimal API + Hexagonal + DDD + SonarCloud + Coverage)
  # Exact name must match branch protection required status checks!
  # ============================================================================
  backend-quality-and-tests:
    name: "Backend (.NET 9 C#): Lint, Strict Build & Test Suites"
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.changes.outputs.backend_changed }}
    defaults:
      run:
        working-directory: src/backend

    steps:
      - name: Checkout Repository with Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Backend & Container Changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || echo "src/backend/")
          elif [ "${{ github.event_name }}" = "push" ]; then
            CHANGED_FILES=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" || echo "src/backend/")
          else
            CHANGED_FILES="src/backend/"
          fi
          echo "Modified files in commit range:"
          echo "$CHANGED_FILES"
          if echo "$CHANGED_FILES" | grep -qE '^(src/backend/|Dockerfile|sonar-project\.properties|\.sonarcloud\.properties)'; then
            echo "BACKEND_CHANGED=true" >> $GITHUB_ENV
            echo "backend_changed=true" >> $GITHUB_OUTPUT
            echo "✅ Backend or Dockerfile changes detected. Running full Backend CI/CD suite."
          else
            echo "BACKEND_CHANGED=false" >> $GITHUB_ENV
            echo "backend_changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Non-backend changes only (docs/README/frontend/workflows). Fast-passing Backend CI checks."
          fi

      - name: Setup Java 21 (SonarCloud Requirement)
        if: env.BACKEND_CHANGED == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "zulu"

      - name: Setup .NET 9.0
        if: env.BACKEND_CHANGED == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install SonarScanner and ReportGenerator
        if: env.BACKEND_CHANGED == 'true'
        run: |
          dotnet tool install --global dotnet-sonarscanner
          dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Restore Dependencies
        if: env.BACKEND_CHANGED == 'true'
        run: dotnet restore MarketPulse.sln

      - name: Verify Code Formatting (dotnet format)
        if: env.BACKEND_CHANGED == 'true'
        run: dotnet format MarketPulse.sln --verify-no-changes --no-restore

      - name: Begin SonarCloud Scanner
        if: env.BACKEND_CHANGED == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet-sonarscanner begin \
            /k:"poferrari_agentic-pipeline-lab" \
            /o:"poferrari" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="${{ github.workspace }}/src/backend/TestResults/**/coverage.opencover.xml" \
            /d:sonar.cs.vstest.reportsPaths="${{ github.workspace }}/src/backend/TestResults/**/*.trx" \
            /d:sonar.coverage.exclusions="**/tests/**,**/Program.cs,**/AppDbContext.cs" \
            /d:sonar.cpd.exclusions="**/tests/**,**/*.test.*,**/docs/**,**/specs/**"

      - name: Build Solution (Zero Warnings Allowed = -warnaserror)
        if: env.BACKEND_CHANGED == 'true'
        run: dotnet build MarketPulse.sln --configuration Release --no-restore -warnaserror

      - name: Check Vulnerable NuGet Packages (OWASP Supply Chain)
        if: env.BACKEND_CHANGED == 'true'
        run: |
          OUT=$(dotnet list MarketPulse.sln package --vulnerable --include-transitive)
          echo "$OUT"
          if echo "$OUT" | grep -q "has the following vulnerable packages"; then
            echo "❌ Vulnerable NuGet packages detected!"
            exit 1
          fi

      - name: Run Unit, Hexagonal Architecture & Integration Tests
        id: backend_tests
        if: env.BACKEND_CHANGED == 'true'
        run: |
          dotnet test MarketPulse.sln --configuration Release --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --logger "console;verbosity=normal" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: CRAP < 10 Gate (ub-mode, ratchet baseline)
        if: env.BACKEND_CHANGED == 'true'
        working-directory: .
        run: python3 scripts/quality/crap_report.py "src/backend/TestResults/**/coverage.opencover.xml"

      - name: End SonarCloud Scanner & Upload Quality Metrics
        if: always() && env.BACKEND_CHANGED == 'true'
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      - name: Generate Code Coverage Markdown Report
        if: always() && env.BACKEND_CHANGED == 'true'
        continue-on-error: true
        run: |
          reportgenerator \
            -reports:"./TestResults/**/coverage.opencover.xml" \
            -targetdir:"./CoverageReport" \
            -reporttypes:"MarkdownSummaryGithub;Badges"
          if [ -f "./CoverageReport/SummaryGithub.md" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "## 📊 Test Coverage Breakdown" >> $GITHUB_STEP_SUMMARY
            cat ./CoverageReport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Generate GitHub Step Summary Report (measured results only)
        if: always()
        run: |
          if [ "$BACKEND_CHANGED" != "true" ]; then
            echo "## Backend CI Fast-Pass" >> $GITHUB_STEP_SUMMARY
            echo "- **Status**: skipped, no files under \``src/backend/**\`` or \``Dockerfile\`` changed." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          python3 - <<'PY' >> $GITHUB_STEP_SUMMARY
          import glob, xml.etree.ElementTree as ET
          ns = "{http://microsoft.com/schemas/VisualStudio/TeamTest/2010}UnitTestResult"
          counts = {"Passed": 0, "Failed": 0, "Other": 0}
          for path in glob.glob("TestResults/**/*.trx", recursive=True):
              for result in ET.parse(path).getroot().iter(ns):
                  outcome = result.get("outcome")
                  counts[outcome if outcome in ("Passed", "Failed") else "Other"] += 1
          print("## Backend test report (parsed from .trx)")
          print(f"- **Tests**: {counts['Passed']} passed, {counts['Failed']} failed, {counts['Other']} not executed")
          PY
          echo "- **Tests step**: ${{ steps.backend_tests.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Job status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # 2. DOCKER CONTAINER BUILD & SMOKE TEST (Render Readiness)
  # ============================================================================
  docker-container-validation:
    name: "Docker Container: Multi-Stage Build & Smoke Test (Port 8080)"
    runs-on: ubuntu-latest
    needs: backend-quality-and-tests
    steps:
      - name: Checkout Repository
        if: needs.backend-quality-and-tests.outputs.backend_changed == 'true'
        uses: actions/checkout@v4

      - name: Build Production Container Image
        if: needs.backend-quality-and-tests.outputs.backend_changed == 'true'
        run: docker build -t agentic-pipeline-lab:ci -f Dockerfile .

      - name: Run Container Smoke Test on Port 8080 (Render Contract)
        if: needs.backend-quality-and-tests.outputs.backend_changed == 'true'
        run: |
          docker run -d --name marketpulse_smoke -p 8080:8080 agentic-pipeline-lab:ci
          LIVE=0
          for i in {1..20}; do
            if curl -sSf http://localhost:8080/health/live > /dev/null 2>&1; then
              echo "✅ Container is LIVE on port 8080!"
              LIVE=1
              break
            fi
            sleep 2
          done
          if [ "$LIVE" -ne 1 ]; then
            echo "❌ Container failed to become healthy. Container logs:"
            docker logs marketpulse_smoke
            exit 1
          fi
          curl -sSf http://localhost:8080/health/live
          curl -sSf http://localhost:8080/health/ready
          curl -sSf "http://localhost:8080/api/v1/rates/USD?symbols=BRL,EUR"
          docker stop marketpulse_smoke

      - name: Fast-Pass Container Check (No Backend/Dockerfile Changes)
        if: needs.backend-quality-and-tests.outputs.backend_changed != 'true'
        run: |
          echo "ℹ️ No changes in src/backend/** or Dockerfile. Skipping Docker container rebuild."
          echo "## ⚡ Docker Container Fast-Pass" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ No backend or \`Dockerfile\` modifications detected. Skipped container image rebuild." >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # 3. SECURITY & OWASP AUDIT (Gitleaks PR Guardrail, Trivy Vulnerability & Secret Scan)
  # ============================================================================
  owasp-security-scan:
    name: "Security (OWASP): Gitleaks & Trivy Secret Guardrail"
    runs-on: ubuntu-latest
    needs: backend-quality-and-tests
    steps:
      - name: Checkout Repository with Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install & Run Gitleaks Secret Guardrail (whole repository)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks dir . --verbose --redact --exit-code 1

      - name: Run Trivy Filesystem Scan (Vulnerabilities)
        if: needs.backend-quality-and-tests.outputs.backend_changed == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "src/backend"
          scanners: "vuln"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true

      - name: Generate Security Guardrail Report (measured results only)
        if: always()
        run: |
          echo "## Security & Secret Guardrail Report" >> $GITHUB_STEP_SUMMARY
          echo "- **Job status (Gitleaks + Trivy, fails on CRITICAL/HIGH)**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # 3b. PIPELINE GOVERNANCE (same commands as scripts/validate-all.ps1 - parity rule)
  # ============================================================================
  pipeline-governance:
    name: "Governance: EN-US Check, Hook Policy Tests & Duplication Gate"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: English-only repository artifacts
        run: python3 -I scripts/quality/check_english_only.py

      - name: Test hygiene gate (ambient clock, fixed waits)
        run: |
          python3 -I -m unittest discover scripts/quality/tests
          python3 -I scripts/quality/check_test_hygiene.py

      - name: Safety hook policy tests
        shell: pwsh
        run: |
          ./.agents/scripts/tests/safety-policy.tests.ps1
          ./.agents/scripts/tests/hooks.tests.ps1

      - name: Duplication gate (jscpd)
        run: npx --yes jscpd@5.4.3 --config .jscpd.json

  # ============================================================================
  # 4. CONTINUOUS DEPLOYMENT TO RENDER CONTAINERS
  # ============================================================================
  deploy-to-render:
    name: "CD: Deploy Backend API to Render (main - backend - api)"
    runs-on: ubuntu-latest
    needs: [backend-quality-and-tests, docker-container-validation, owasp-security-scan, pipeline-governance]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.backend-quality-and-tests.outputs.backend_changed == 'true'
    environment:
      name: "main - backend - api"
      url: "https://agentic-pipeline-lab-api.onrender.com"
    steps:
      - name: Trigger Render Deploy Hook (if configured)
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl -sSf -X POST "$RENDER_DEPLOY_HOOK_URL"
            echo "✅ Render Deploy Hook triggered successfully for prj-d6rakhshg0os73a5ahqg!" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ Render Native Git Auto-Deploy active via render.yaml." >> $GITHUB_STEP_SUMMARY
          fi
