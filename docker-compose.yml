services:
  marketpulse-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketpulse_lab_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      PORT: "8080"
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=marketpulse_db;Username=postgres;Password=postgres_dev_password"
      ConnectionStrings__RabbitMq: "amqp://guest:guest@rabbitmq:5672"
      ExternalApis__FrankfurterBaseUrl: "https://api.frankfurter.app/"
      Auth__AllowDemoHeader: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://aspire-dashboard:4317"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: marketpulse_lab_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-marketpulse_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - marketpulse_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-marketpulse_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: marketpulse_lab_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - marketpulse_rmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.0
    container_name: marketpulse_lab_dashboard
    restart: unless-stopped
    ports:
      - "18888:18888"
      - "4317:4317"
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
      DOTNET_DASHBOARD_OTLP_ENDPOINT_URL: "http://+:4317"

volumes:
  marketpulse_pg_data:
  marketpulse_rmq_data:
